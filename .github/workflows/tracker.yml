name: Duo tracker

on:
  schedule:
    - cron: "17 * * * *" # hourly; a queued run takes over when the current one ends
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification to every iPhone with alerts on"
        type: boolean
        default: false

permissions:
  contents: write # publishes live status to the `status` branch for the web page

concurrency:
  group: duo-tracker
  cancel-in-progress: false

jobs:
  track:
    # Set the repo variable HOME_LAB=true once the home-lab tracker is running, so GitHub stops (avoids duplicate alerts).
    if: vars.HOME_LAB != 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Watch Apple Store pickup
        run: node tracker.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ secrets.ZIP }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RADIUS_MILES: ${{ vars.RADIUS_MILES || '30' }}
          INTERVAL_SEC: ${{ vars.INTERVAL_SEC || '20' }}
          INCLUDE_CARRIER: ${{ vars.INCLUDE_CARRIER || 'false' }}
          PARTS: ${{ vars.PARTS }}
          TEST_ALERT: ${{ inputs.test_alert }}
